/* =========================================================

/* =========================================================
   WARP EFFECT LAYER
   ========================================================= */

#warp {

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}


/* =========================================================
   CENTRAL WARP GLOW
   ========================================================= */

.warp-core {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 500px;
    height: 500px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(150, 40, 255, 0.13) 0%,
            rgba(70, 40, 180, 0.08) 30%,
            rgba(20, 80, 180, 0.04) 50%,
            transparent 72%
        );

    filter: blur(2px);

    animation:
        corePulse 5s ease-in-out infinite;
}


@keyframes corePulse {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.55;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.10);

        opacity: 1;
    }
}


/* =========================================================
   WARP RINGS
   ========================================================= */

.warp-ring {

    opacity: 0.7;
}

}

@keyframes spin1 {

    from {

        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


@keyframes spin2 {

    from {

        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }
}


/* =========================================================
   PARTICLES
   ========================================================= */

.particle {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    opacity: 0;

    box-shadow:
        0 0 5px currentColor,
        0 0 12px currentColor,
        0 0 25px currentColor;

    animation:
        warpFly var(--duration) linear infinite;

    animation-delay:
        var(--delay);
}


/*
   The bright centre of each ember
*/

.particle::after {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        currentColor;

    opacity: 0.25;

    filter: blur(6px);
}


/* =========================================================
   WARP MOTION
   ========================================================= */

@keyframes warpFly {

    0% {

        transform:
            translate(
                var(--start-x),
                var(--start-y)
            )
            scale(0.1)
            rotate(0deg);

        opacity: 0;
    }


    8% {

        opacity: 0.9;
    }


    25% {

        transform:
            translate(
                var(--mid-x),
                var(--mid-y)
            )
            scale(0.8)
            rotate(90deg);

        opacity: 1;
    }


    45% {

        transform:
            translate(
                var(--curve-x),
                var(--curve-y)
            )
            scale(1.2)
            rotate(180deg);

        opacity: 0.95;
    }


    65% {

        transform:
            translate(
                var(--outer-x),
                var(--outer-y)
            )
            scale(0.9)
            rotate(280deg);

        opacity: 0.7;
    }


    82% {

}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/*
=========================================================
SUPABASE CONFIG
=========================================================
*/

const SUPABASE_URL =
    "https://jbgwdxavydhtvoqpbfmj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Wt8h6fNelT6zrzf-Dm8FXw_cdSGylaz";


/*
=========================================================
CREATE CLIENT

IMPORTANT:
Do not rename this to "supabase".
=========================================================
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
=========================================================
ELEMENTS
=========================================================
*/

const loginView =
    document.getElementById("loginView");

const createView =
    document.getElementById("createView");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const createEmail =
    document.getElementById("createEmail");

const createPassword =
    document.getElementById("createPassword");

const signInButton =
    document.getElementById("signInButton");

const showCreateButton =
    document.getElementById("showCreateButton");

const createAccountButton =
    document.getElementById("createAccountButton");

const backButton =
    document.getElementById("backButton");

const status =
    document.getElementById("status");


/*
=========================================================
STATUS
=========================================================
*/

function setStatus(
    message,
    type = ""
) {

    status.textContent =
        message;

    status.className =
        type;

}


/*
=========================================================
SHOW CREATE ACCOUNT
=========================================================
*/

showCreateButton.addEventListener(
    "click",
    function () {

        loginView.classList.add(
            "hidden"
        );

        createView.classList.remove(
            "hidden"
        );

        setStatus("");

        createEmail.focus();

    }
);


/*
=========================================================
BACK TO LOGIN
=========================================================
*/

backButton.addEventListener(
    "click",
    function () {

        createView.classList.add(
            "hidden"
        );

        loginView.classList.remove(
            "hidden"
        );

        setStatus("");

        loginEmail.focus();

    }
);


/*
=========================================================
SIGN IN
=========================================================
*/

signInButton.addEventListener(
    "click",
    async function () {

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;


        if (!email || !password) {

            setStatus(
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        signInButton.disabled =
            true;

        signInButton.textContent =
            "SIGNING IN...";


        try {

            const result =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (result.error) {

                setStatus(
                    result.error.message,
                    "error"
                );

                return;
            }


            setStatus(
                "Signed in successfully.",
                "success"
            );

        }

        catch (error) {

            setStatus(
                "Login error: " +
                error.message,
                "error"
            );

        }

        finally {

            signInButton.disabled =
                false;

            signInButton.textContent =
                "SIGN IN";

        }

    }
);


/*
=========================================================
CREATE ACCOUNT
=========================================================
*/

createAccountButton.addEventListener(
    "click",
    async function () {

        const email =
            createEmail.value.trim();

        const password =
            createPassword.value;


        if (!email || !password) {

            setStatus(
                "Please enter an email and password.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            setStatus(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        createAccountButton.disabled =
            true;

        createAccountButton.textContent =
            "CREATING...";


        try {

            const result =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


            if (result.error) {

                setStatus(
                    result.error.message,
                    "error"
                );

                return;
            }


            if (
                result.data.user &&
                !result.data.session
            ) {

                setStatus(
                    "Account created. Check your email to confirm your account.",
                    "success"
                );

            }

            else {

                setStatus(
                    "Account created successfully.",
                    "success"
                );

            }

        }

        catch (error) {

            setStatus(
                "Account error: " +
                error.message,
                "error"
            );

        }

        finally {

            createAccountButton.disabled =
                false;

            createAccountButton.textContent =
                "CREATE ACCOUNT";

        }

    }
);


/*
=========================================================
ENTER TO SIGN IN
=========================================================
*/

loginPassword.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            signInButton.click();

        }

    }
);


/*
=========================================================
ENTER TO CREATE ACCOUNT
=========================================================
*/

createPassword.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            createAccountButton.click();

        }

    }
);


/*
=========================================================
CHECK SUPABASE
=========================================================
*/

async function checkSupabase() {

    try {

        const result =
            await supabaseClient.auth.getSession();


        if (result.error) {

            setStatus(
                "Supabase error: " +
                result.error.message,
                "error"
            );

            return;

        }


        if (result.data.session) {

            setStatus(
                "Supabase authentication is working.",
                "success"
            );

        }

        else {

            setStatus(
                "SUPABASE CONNECTED ✓",
                "success"
            );

        }

    }

    catch (error) {

        setStatus(
            "Connection error: " +
            error.message,
            "error"
        );

    }

}


checkSupabase();

</script>
