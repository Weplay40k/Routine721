/* =========================================================
   CENTRAL WARP VORTEX
   ========================================================= */

.warp-core {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 420px;

    height: 420px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(120, 20, 180, 0.08) 0%,
            rgba(40, 80, 200, 0.04) 35%,
            transparent 70%
        );

    box-shadow:

        0 0 50px
        rgba(150, 30, 220, 0.12),

        inset 0 0 70px
        rgba(30, 100, 220, 0.08);

    animation:
        corePulse 5s ease-in-out infinite;
}


@keyframes corePulse {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.92);

        opacity: 0.6;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.08);

        opacity: 1;
    }
}


/* =========================================================
   ROTATING WARP RINGS
   ========================================================= */

.warp-ring {

    position: absolute;

    left: 50%;

    top: 50%;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


.ring-purple {

    width: 480px;

    height: 280px;

    border:

    box-shadow:

}


.ring-blue {

    width: 400px;

    border:

    box-shadow:

    animation:
        ringSpinReverse 18s linear infinite;
}


.ring-red {

    width: 540px;

    height: 310px;

    border:
        2px solid
        rgba(255, 45, 45, 0.25);

    box-shadow:
        0 0 20px
        rgba(255, 45, 45, 0.15);

    animation:
        ringSpin 22s linear infinite;
}


@keyframes ringSpin {

    from {

        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


@keyframes ringSpinReverse {

    from {

        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }
}


/* =========================================================
   PARTICLES
   ========================================================= */

.warp-particle {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 5px;

    height: 5px;

    border-radius: 50%;

    opacity: 0;

    box-shadow:
        0 0 6px currentColor,
        0 0 15px currentColor,
        0 0 30px currentColor;

    animation:
        flyWarp var(--speed)
        linear infinite;

    animation-delay:
        var(--delay);
}


.warp-particle::after {

    content: "";

    position: absolute;

    width: 20px;

    height: 20px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: currentColor;

    opacity: 0.2;

    filter: blur(6px);
}


/* =========================================================
   PARTICLE ANIMATION
   ========================================================= */

@keyframes flyWarp {

    0% {

        transform:
            translate(
                var(--sx),
                var(--sy)
            )
            rotate(0deg)
            scale(0.2);

        opacity: 0;
    }


    10% {

    30% {

    55% {

    75% {

            translate(
                var(--ox),
                var(--oy)

            rotate(330deg)
            scale(0.9);

        opacity: 0.6;
    }


    100% {

        transform:
            translate(
                var(--ex),
                var(--ey)
            )
            rotate(500deg)
            scale(0.1);

        opacity: 0;
    }
}

<script>

/*
 * SUPABASE
 */

const SUPABASE_URL =
    "https://jbgwdxavydhtvoqpbfmj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Wt8h6fNelT6zrzf-Dm8FXw_cdSGylaz";


/*
 * IMPORTANT:
 *
 * We call this "supabaseClient".
 * Do NOT call it "supabase".
 */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
 * ELEMENTS
 */

const loginView =
    document.getElementById("loginView");

const createView =
    document.getElementById("createView");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const createEmail =
    document.getElementById("createEmail");

const createPassword =
    document.getElementById("createPassword");

const signInButton =
    document.getElementById("signInButton");

const createAccountButton =
    document.getElementById("createAccountButton");

const showCreateButton =
    document.getElementById("showCreateButton");

const backToLoginButton =
    document.getElementById("backToLoginButton");

const status =
    document.getElementById("status");


/*
 * STATUS
 */

function showStatus(
    message,
    type = ""
) {

    status.textContent = message;

    status.className =
        "status " + type;
}


/*
 * CREATE ACCOUNT SCREEN
 */

showCreateButton.addEventListener(
    "click",
    function () {

        loginView.classList.add("hidden");

        createView.classList.remove("hidden");

        showStatus("");

        createEmail.focus();
    }
);


/*
 * BACK TO LOGIN
 */

backToLoginButton.addEventListener(
    "click",
    function () {

        createView.classList.add("hidden");

        loginView.classList.remove("hidden");

        showStatus("");

        loginEmail.focus();
    }
);


/*
 * SIGN IN
 */

signInButton.addEventListener(
    "click",
    async function () {

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;


        if (!email || !password) {

            showStatus(
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        signInButton.disabled = true;

        signInButton.textContent =
            "SIGNING IN...";


        try {

            const result =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (result.error) {

                showStatus(
                    result.error.message,
                    "error"
                );

                return;
            }


            showStatus(
                "Authentication successful.",
                "success"
            );

        }

        catch (error) {

            showStatus(
                "Login error: " +
                error.message,
                "error"
            );

        }

        finally {

            signInButton.disabled = false;

            signInButton.textContent =
                "SIGN IN";
        }

    }
);


/*
 * CREATE ACCOUNT
 */

createAccountButton.addEventListener(
    "click",
    async function () {

        const email =
            createEmail.value.trim();

        const password =
            createPassword.value;


        if (!email || !password) {

            showStatus(
                "Please enter an email and password.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showStatus(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        createAccountButton.disabled =
            true;

        createAccountButton.textContent =
            "CREATING...";


        try {

            const result =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


            if (result.error) {

                showStatus(
                    result.error.message,
                    "error"
                );

                return;
            }


            if (
                result.data.user &&
                !result.data.session
            ) {

                showStatus(
                    "Account created. Check your email to confirm your account.",
                    "success"
                );

            }

            else {

                showStatus(
                    "Account created successfully.",
                    "success"
                );

            }

        }

        catch (error) {

            showStatus(
                "Account error: " +
                error.message,
                "error"
            );

        }

        finally {

            createAccountButton.disabled =
                false;

            createAccountButton.textContent =
                "CREATE ACCOUNT";
        }

    }
);


/*
 * ENTER KEY
 */

loginPassword.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            signInButton.click();

        }

    }
);


createPassword.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            createAccountButton.click();

        }

    }
);


/*
 * CHECK SUPABASE
 */

async function initialize() {

    try {

        const result =
            await supabaseClient.auth.getSession();


        if (result.error) {

            showStatus(
                "Supabase error: " +
                result.error.message,
                "error"
            );

            return;
        }


        if (result.data.session) {

            showStatus(
                "Supabase authentication is working.",
                "success"
            );

        }

        else {

            showStatus(
                "SUPABASE CONNECTED",
                "success"
            );

        }

    }

    catch (error) {

        showStatus(
            "Connection error: " +
            error.message,
            "error"
        );

    }

}


initialize();

</script>
