/*

HELPERS
========================================================
*/

function esc(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function initials(name) {
    if (!name) return "?";

    return name
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(x => x[0])
        .join("")
        .toUpperCase();
}

function percent(value) {
    if (!value || isNaN(value)) return "0%";
    return Math.round(value) + "%";
}

function calculateStats(list) {
    let wins = 0;
    let losses = 0;
    let draws = 0;

    list.forEach(game => {
        if (game.result === "Win") wins++;
        else if (game.result === "Loss") losses++;
        else if (game.result === "Draw") draws++;
    });

    const total = wins + losses + draws;

    const rate =
        total === 0
            ? 0
            : ((wins + draws * 0.5) / total) * 100;

    return {
        total,
        wins,
        losses,
        draws,
        rate
    };
}

function playerName(id) {
    const member = members.find(x => x.user_id === id);

    return member?.profiles?.display_name || "Player";
}

function showMessage(text) {
    const old = document.querySelector(".message");

    if (old) old.remove();

    const div = document.createElement("div");

    div.className = "message";
    div.textContent = text;

    document.body.appendChild(div);

    setTimeout(() => div.remove(), 3500);
}

AUTH SCREEN

function renderAuth() {

    document.getElementById("root").innerHTML = `
        <div class="auth-screen">

            <div class="auth-box">

                        11th Edition · Campaign Command

                    <form id="authForm">

                        <div class="form-grid">

                            <label class="full">
                                Email

                                    id="authEmail"

                                    required
                                    autocomplete="email">

                            <label class="full">
                                Password
                                <input
                                    id="authPassword"
                                    type="password"
                                    minlength="6"
                                    required
                                    autocomplete="current-password">
                            </label>

                            <label
                                id="displayNameWrap"
                                class="full hidden">

                                Display name

                                <input
                                    id="authDisplayName"
                                    type="text"
                                    placeholder="Your Warhammer name">

                            </label>

                            <div class="full">

                                <button
                                    id="authButton"
                                    class="btn btn-primary"
                                    type="submit"
                                    style="width:100%">

                                    Enter War Room

                                </button>

                            </div>

                        </div>

                    </form>

                    <div
                        id="authStatus"
                        class="status">
                    </div>

                    <div class="notice">

                        Your battle records are protected by
                        Supabase authentication and database
                        security.

                    </div>

                </div>

            </div>

        </div>
    `;

    let mode = "login";

    function setMode(newMode) {

        mode = newMode;

        document
            .getElementById("loginTab")
            .classList.toggle(
                "active",
                mode === "login"
            );

        document
            .getElementById("signupTab")
            .classList.toggle(
                "active",
                mode === "signup"
            );

        document
            .getElementById("displayNameWrap")
            .classList.toggle(
                "hidden",
                mode !== "signup"
            );

        document
            .getElementById("authButton")
            .textContent =
                mode === "login"
                    ? "Enter War Room"
                    : "Create Account";
    }

    document
        .getElementById("loginTab")
        .onclick = () => setMode("login");

    document
        .getElementById("signupTab")
        .onclick = () => setMode("signup");


    document
        .getElementById("authForm")
        .onsubmit = async function(event) {

            event.preventDefault();

            const status =
                document.getElementById("authStatus");

            const email =
                document
                    .getElementById("authEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("authPassword")
                    .value;

            status.textContent =
                "Processing...";


            if (mode === "login") {

                const { data, error } =
                    await sbClient.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {

                    status.textContent =
                        "Login error: " +
                        error.message;

                    return;
                }

                currentUser = data.user;

                status.textContent =
                    "Signed in successfully.";

                await startApp();

            } else {

                const displayName =
                    document
                        .getElementById("authDisplayName")
                        .value
                        .trim();

                const { data, error } =
                    await sbClient.auth.signUp({

                        email,
                        password,

                        options: {
                            data: {
                                display_name:
                                    displayName
                            }
                        }

                    });

                if (error) {

                    status.textContent =
                        "Signup error: " +
                        error.message;

                    return;
                }


                if (data.user) {

                    /*
                    Create/update the profile.
                    */

                    await sbClient
                        .from("profiles")
                        .upsert({
                            id: data.user.id,
                            display_name:
                                displayName ||
                                email.split("@")[0]
                        });


                    if (data.session) {

                        currentUser =
                            data.user;

                        await startApp();

                    } else {

                        status.textContent =
                            "Account created! Check your email to confirm your account, then sign in.";

                    }

                }

            }

        };
}

/*
========================================================
LOAD GROUP DATA
========================================================
*/

async function loadGroupData() {

    members = [];
    games = [];
    currentGroup = null;


    /*
    Find groups belonging to current user.
    */

    const { data: memberships, error } =
        await sbClient
            .from("group_members")
            .select(`
                group_id,
                user_id,
                role,
                joined_at,
                groups (
                    id,
                    name,
                    invite_code,
                    created_by,
                    created_at
                )
            `)
            .eq(
                "user_id",
                currentUser.id
            );


    if (error) {

        console.error(error);

        throw new Error(
            "Could not load your group: " +
            error.message
        );

    }


    if (!memberships || memberships.length === 0) {

        return false;

    }


    currentGroup =
        memberships[0].groups;


    /*
    Load members.
    */

    const { data: memberData, error: memberError } =
        await sbClient
            .from("group_members")
            .select(`
                group_id,
                user_id,
                role,
                joined_at,
                profiles (
                    id,
                    display_name,
                    avatar_url
                )
            `)
            .eq(
                "group_id",
                currentGroup.id
            );


    if (memberError) {

        console.error(memberError);

        throw new Error(
            "Could not load members: " +
            memberError.message
        );

    }


    members = memberData || [];


    /*
    Load games.
    */

    const { data: gameData, error: gameError } =
        await sbClient
            .from("games")
            .select("*")
            .eq(
                "group_id",
                currentGroup.id
            )
            .order(
                "played_at",
                {
                    ascending: false
                }
            );


    if (gameError) {

        console.error(gameError);

        throw new Error(
            "Could not load games: " +
            gameError.message
        );

    }


    games = gameData || [];


    return true;
}

function switchView(view) {

        .querySelectorAll("[data-view]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.view === view
            );

        renderGames();

        renderPlayers();

function leaderboardHTML() {

    if (!members.length) {

        return `
            <div class="empty">

            </div>
        `;

    }


    const ranking =
        members
            .map(member => {

                const memberGames =
                    games.filter(
                        game =>
                            game.player_id ===
                            member.user_id
                    );

                return {
                    member,
                    stats:
                        calculateStats(memberGames)
                };

            })
            .sort(
                (a, b) =>
                    b.stats.rate -
                    a.stats.rate
            );


    return ranking
        .slice(0, 10)
        .map((item, index) => {

            const name =
                item.member.profiles
                    ?.display_name ||
                "Player";

            return `

                <div class="barline">

                        ${index + 1}.
                        ${esc(name)}

                        </div>

                    </div>

                        ${percent(item.stats.rate)}
                    </b>

                </div>

            `;

        })
        .join("");

async function saveGame(event) {

    event.preventDefault();


    const game = {

        group_id:
            currentGroup.id,

        played_at:
            document.getElementById(
                "gameDate"
            ).value,

        player_id:
            document.getElementById(
                "gamePlayer"
            ).value,

        player_faction:
            document.getElementById(
                "playerFaction"
            ).value.trim(),

        opponent_name:
            document.getElementById(
                "opponentName"
            ).value.trim(),

        opponent_faction:
            document.getElementById(
                "opponentFaction"
            ).value.trim(),

        result:
            document.getElementById(
                "gameResult"
            ).value,

        player_vp:
            document.getElementById(
                "playerVP"
            ).value
                ? Number(
                    document.getElementById(
                        "playerVP"
                    ).value
                )
                : null,

        opponent_vp:
            document.getElementById(
                "opponentVP"
            ).value
                ? Number(
                    document.getElementById(
                        "opponentVP"
                    ).value
                )
                : null,

        mission:
            document.getElementById(
                "mission"
            ).value.trim(),

        event_name:
            document.getElementById(
                "eventName"
            ).value.trim(),

        notes:
            document.getElementById(
                "gameNotes"
            ).value.trim()

    };


    const { error } =
        await sbClient
            .from("games")
            .insert(game);


    if (error) {

        alert(
            "Could not save battle:\n\n" +
            error.message
        );

        return;
    }


    showMessage(
        "Battle recorded successfully!"
    );


    await loadGroupData();

    renderGames();

}

========================================================

function renderFactions() {

    const factionMap = {};


    games.forEach(game => {

        const faction =
            game.player_faction;

        if (!factionMap[faction]) {

            factionMap[faction] = {
                total: 0,
                wins: 0,
                losses: 0,
                draws: 0
            };

        }


        factionMap[faction].total++;


        if (game.result === "Win")
            factionMap[faction].wins++;

        if (game.result === "Loss")
            factionMap[faction].losses++;

        if (game.result === "Draw")
            factionMap[faction].draws++;

    });


    const factions =
        Object.entries(
            factionMap
        )
        .sort(
            (a, b) => {

                const ar =
                    (
                        a[1].wins +
                        a[1].draws * .5
                    ) /
                    a[1].total;

                const br =
                    (
                        b[1].wins +
                        b[1].draws * .5
                    ) /
                    b[1].total;

                return br - ar;

            }
        );


    document.getElementById("mainContent").innerHTML = `

        <div class="hero">

            <div class="kicker">
                Faction Intelligence
            </div>

            <h1>
                Factions
            </h1>

            <p>
                See how your armies are performing.
            </p>

        </div>


        <div class="grid">

            ${
                factions.length

                    ? factions.map(
                        ([name, data]) => {

                            const rate =
                                (
                                    data.wins +
                                    data.draws * .5
                                ) /
                                data.total *
                                100;


                            return `

                                <div class="card stat-card">

                                    <div class="label">
                                        ${esc(name)}
                                    </div>

                                    <div class="stat">
                                        ${percent(rate)}
                                    </div>

                                    <div class="muted small">

                                        ${data.total}
                                        games ·

                                        ${data.wins}W

                                        ${data.losses}L

                                        ${data.draws}D

                                    </div>

                                </div>

                            `;

                        }
                    ).join("")

                    : `

                        <div class="card">

                            <div class="empty">
                                Log some battles to see faction statistics.
                            </div>

                        </div>

                    `
            }

        </div>

    `;

}

sbClient.auth.onAuthStateChange(
    async function(event, session) {

        console.log(
            "Auth event:",
            event
        );

        if (session?.user) {

            currentUser =
                session.user;

            /*
            Do not immediately reload repeatedly.
            */

            if (
                event === "SIGNED_IN" ||
                event === "INITIAL_SESSION"
            ) {

                await startApp();

            }

        } else if (
            event === "SIGNED_OUT"
        ) {

            currentUser = null;

            renderAuth();

        }

    }
);

            return;

        }


        if (data.session?.user) {

            currentUser =
                data.session.user;

            await startApp();

        } else {

            renderAuth();

        }

    } catch(error) {

        console.error(error);

        renderAuth();

    }

}


initialise();

</script>
