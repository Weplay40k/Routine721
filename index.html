<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Routine 721</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         WARP VORTEX PARTICLES
         ===================================================== -->

    <div id="warp-effects" aria-hidden="true">

        <div class="warp-particle p1"></div>
        <div class="warp-particle p2"></div>
        <div class="warp-particle p3"></div>

    </div>


    <!-- =====================================================
         LOGIN
         ===================================================== -->

    <main class="login-container">

        <div class="box">

            <h1>ROUTINE 721</h1>

            <div class="subtitle">
                WAR ROOM
            </div>


            <!-- LOGIN VIEW -->

            <section id="loginView">

                <h2>Welcome Back</h2>

                <p class="intro">
                    Enter your credentials to access the War Room.
                </p>


                <label for="loginEmail">
                    Email
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="your@email.com"
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Password"
                >


                <button
                    id="signInButton"
                    class="primary-button"
                    type="button"
                >
                    SIGN IN
                </button>


                <button
                    id="showCreateButton"
                    class="secondary-button"
                    type="button"
                >
                    CREATE ACCOUNT
                </button>

            </section>


            <!-- CREATE ACCOUNT VIEW -->

            <section
                id="createView"
                class="hidden"
            >

                <h2>Create Account</h2>

                <p class="intro">
                    Create your Routine 721 War Room account.
                </p>


                <label for="createEmail">
                    Email
                </label>

                <input
                    id="createEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="your@email.com"

                <label for="createPassword">

                <input

                    class="secondary-button"

                >
                    BACK TO SIGN IN
                </button>

            </section>


            <!-- STATUS -->

            <div
                id="status"
                class="status"
                aria-live="polite"
            >
                Connecting to database...
            </div>

        </div>

    </main>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /*
         * IMPORTANT:
         *
         * These are your existing Supabase project details.
         */

        const SUPABASE_URL =
            "https://jbgwdxavydhtvoqpbfmj.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Wt8h6fNelT6zrzf-Dm8FXw_cdSGylaz";


        /*
         * IMPORTANT:
         *
         * We use "supabaseClient" instead of "supabase"
         * so we don't collide with the Supabase library's
         * global variable.
         */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const loginView =
            document.getElementById("loginView");

        const createView =
            document.getElementById("createView");

        const loginEmail =
            document.getElementById("loginEmail");

        const loginPassword =
            document.getElementById("loginPassword");

        const createEmail =
            document.getElementById("createEmail");

        const createPassword =
            document.getElementById("createPassword");

        const signInButton =
            document.getElementById("signInButton");

        const createAccountButton =
            document.getElementById("createAccountButton");

        const showCreateButton =
            document.getElementById("showCreateButton");

        const backToLoginButton =
            document.getElementById("backToLoginButton");

        const status =
            document.getElementById("status");


        /* =====================================================
           STATUS
           ===================================================== */

        function showStatus(
            message,
            type = ""
        ) {

            status.textContent = message;

            status.className =
                "status " + type;
        }


        /* =====================================================
           SHOW CREATE ACCOUNT
           ===================================================== */

        showCreateButton.addEventListener(
            "click",
            function () {

                loginView.classList.add("hidden");

                createView.classList.remove("hidden");

                showStatus("");

                createEmail.focus();
            }
        );


        /* =====================================================
           BACK TO LOGIN
           ===================================================== */

        backToLoginButton.addEventListener(
            "click",
            function () {

                createView.classList.add("hidden");

                loginView.classList.remove("hidden");

                showStatus("");

                loginEmail.focus();
            }
        );


        /* =====================================================
           SIGN IN
           ===================================================== */

        signInButton.addEventListener(
            "click",
            async function () {

                const email =
                    loginEmail.value.trim();

                const password =
                    loginPassword.value;


                if (!email || !password) {

                    showStatus(
                        "Please enter your email and password.",
                        "error"
                    );

                    return;
                }


                signInButton.disabled = true;

                signInButton.textContent =
                    "SIGNING IN...";


                try {

                    const result =
                        await supabaseClient.auth.signInWithPassword({

                            email: email,

                            password: password

                        });


                    if (result.error) {

                        showStatus(
                            result.error.message,
                            "error"
                        );

                        return;
                    }


                    showStatus(
                        "Authentication successful.",
                        "success"
                    );


                    /*
                     * Give Supabase a moment to save the session.
                     */

                    setTimeout(
                        function () {

                            window.location.reload();

                        },
                        700
                    );

                }

                catch (error) {

                    showStatus(
                        "Login error: " +
                        error.message,
                        "error"
                    );

                }

                finally {

                    signInButton.disabled = false;

                    signInButton.textContent =
                        "SIGN IN";
                }

            }
        );


        /* =====================================================
           CREATE ACCOUNT
           ===================================================== */

        createAccountButton.addEventListener(
            "click",
            async function () {

                const email =
                    createEmail.value.trim();

                const password =
                    createPassword.value;


                if (!email || !password) {

                    showStatus(
                        "Please enter an email and password.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showStatus(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;
                }


                createAccountButton.disabled = true;

                createAccountButton.textContent =
                    "CREATING...";


                try {

                    const result =
                        await supabaseClient.auth.signUp({

                            email: email,

                            password: password

                        });


                    if (result.error) {

                        showStatus(
                            result.error.message,
                            "error"
                        );

                        return;
                    }


                    if (
                        result.data.user &&
                        !result.data.session
                    ) {

                        showStatus(
                            "Account created. Check your email to confirm your account.",
                            "success"
                        );

                    }

                    else {

                        showStatus(
                            "Account created successfully.",
                            "success"
                        );

                    }

                }

                catch (error) {

                    showStatus(
                        "Account error: " +
                        error.message,
                        "error"
                    );

                }

                finally {

                    createAccountButton.disabled =
                        false;

                    createAccountButton.textContent =
                        "CREATE ACCOUNT";
                }

            }
        );


        /* =====================================================
           ENTER KEY
           ===================================================== */

        loginPassword.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    signInButton.click();

                }

            }
        );


        createPassword.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    createAccountButton.click();

                }

            }
        );


        /* =====================================================
           INITIAL CONNECTION
           ===================================================== */

        async function initialize() {

            try {

                const result =
                    await supabaseClient.auth.getSession();


                if (result.error) {

                    showStatus(
                        "Supabase error: " +
                        result.error.message,
                        "error"
                    );

                    return;
                }


                if (result.data.session) {

                    showStatus(
                        "Supabase authentication is working.",
                        "success"
                    );

                }

                else {

                    showStatus(
                        "SUPABASE CONNECTED",
                        "success"
                    );

                }

            }

            catch (error) {

                showStatus(
                    "Connection error: " +
                    error.message,
                    "error"
                );

            }

        }


        initialize();

    </script>

</body>
</html>
