const SUPABASE_KEY =

/*
  IMPORTANT:
  We call the Supabase client "client" instead of "supabase".
  This avoids the redeclaration error you previously had.
*/
const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ============================================================
   STATE
============================================================ */

const state = {
  user: null,
  profile: null,
  group: null,
  members: [],
  games: [],
  view: "dashboard"
};


/* ============================================================
   HELPERS
============================================================ */

function $(selector) {
  return document.querySelector(selector);
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/[&<>"']/g, function(character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character];
    });
}

function initials(value) {
  return String(value || "?")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function percentage(value) {
  return Number(value || 0).toFixed(1) + "%";
}

function showToast(message) {
  const toast = $("#toast");

  toast.textContent = message;
  toast.classList.remove("hidden");

  setTimeout(function() {
    toast.classList.add("hidden");
  }, 3000);
}

function getStats(games) {

  const wins =
    games.filter(g => g.result === "Win").length;

  const losses =
    games.filter(g => g.result === "Loss").length;

  const draws =
    games.filter(g => g.result === "Draw").length;

  const total = games.length;

  const rate =
    total
      ? ((wins + draws * 0.5) / total) * 100
      : 0;

  return {
    wins,
    losses,
    draws,
    total,
    rate
  };
}

function playerName(userId) {

  const member =
    state.members.find(
      member => member.user_id === userId
    );

  return (
    member?.profiles?.display_name ||
    "Player"
  );
}

function resultPill(result) {

  const className =
    result === "Win"
      ? "win"
      : result === "Loss"
        ? "loss"
        : "draw";

  return `
    <span class="pill ${className}">
      ${escapeHTML(result)}
    </span>
  `;
}

function renderAuth() {

  $("#app").innerHTML = `
    <div class="auth-screen">
      <div class="auth-box">

        <div class="kicker">
          11th Edition · Campaign Command
        </div>

        <div class="brand">
          ROUTINE 721
        </div>

        <p style="text-align:center">
          Shared battle records for your Warhammer 40K gaming group.
        </p>

        <div class="auth-tabs">

          <button
            id="loginTab"
            class="btn primary"
            style="flex:1"
          >
            Sign In
          </button>

          <button
            id="signupTab"
            class="btn"
            style="flex:1"
          >
            Create Account
          </button>

        </div>

        <form id="authForm" class="form-grid">

          <label class="full">
            Email
            <input
              id="authEmail"
              type="email"
              required
            >
          </label>

          <label class="full">
            Password
            <input
              id="authPassword"
              type="password"
              minlength="6"
              required
            >
          </label>

          <label
            id="displayNameWrap"
            class="full hidden"
          >
            Display name
            <input
              id="displayName"
              placeholder="Phil"
            >
          </label>

          <button
            id="authSubmit"
            type="submit"
            class="btn primary full"
          >
            Enter War Room
          </button>

        </form>

        <div
          id="authMessage"
          class="small muted"
          style="margin-top:12px"
        ></div>

      </div>
    </div>
  `;

  let mode = "login";

  function setMode(newMode) {

    mode = newMode;

    $("#loginTab")
      .classList
      .toggle("primary", mode === "login");

    $("#signupTab")
      .classList
      .toggle("primary", mode === "signup");

    $("#displayNameWrap")
      .classList
      .toggle("hidden", mode !== "signup");

    $("#authSubmit").textContent =
      mode === "login"
        ? "Enter War Room"
        : "Create Account";
  }

  $("#loginTab").onclick =
    function() {
      setMode("login");
    };

  $("#signupTab").onclick =
    function() {
      setMode("signup");
    };

  $("#authForm").onsubmit =
    async function(event) {

      event.preventDefault();

      const email =
        $("#authEmail").value.trim();

      const password =
        $("#authPassword").value;

      $("#authMessage").textContent =
        "Processing...";

      let result;

      if (mode === "login") {

        result =
          await client.auth.signInWithPassword({
            email,
            password
          });

      } else {

        result =
          await client.auth.signUp({
            email,
            password,
            options: {
              data: {
                display_name:
                  $("#displayName").value.trim()
              }
            }
          });

      }

      if (result.error) {

        $("#authMessage").innerHTML =
          `<span class="red">
            ${escapeHTML(result.error.message)}
          </span>`;

        return;
      }

      if (
        mode === "signup" &&
        !result.data.session
      ) {

        $("#authMessage").textContent =
          "Account created. Check your email for the confirmation link, then sign in.";

        return;
      }

      await refresh();
    };
}

        $("#groupMessage").innerHTML =
          `<span class="red">
            ${escapeHTML(result.error.message)}
          </span>`;

        return;
      }

      showToast("Joined group");

      await refresh();
    };
}

function leaderboardHTML() {

  const players =
    state.members
      .map(member => {

        const games =
          state.games.filter(
            game =>
              game.player_id ===
              member.user_id
          );

        return {
          member,
          stats: getStats(games)
        };

      })
      .sort(
        (a, b) =>
          b.stats.rate -
          a.stats.rate
      );


  if (!players.length) {

    return `
      <div class="empty">
        No players yet.
      </div>

async function loadData() {

  /*
    Find the group membership for the
    currently logged-in user.
  */

  const membershipResult =
    await client
      .from("group_members")
      .select(`
        group_id,
        user_id,
        role,
        joined_at,
        groups (
          id,
          name,
          invite_code,
          created_by,
          created_at
        )
      `)
      .eq(
        "user_id",
        state.user.id
      );


  if (membershipResult.error) {

    throw membershipResult.error;

  }


  if (
    !membershipResult.data ||
    membershipResult.data.length === 0
  ) {

    state.group = null;

    return;

  }


  state.group =
    membershipResult.data[0].groups;


  /*
    Get all members.
  */

  const membersResult =
    await client
      .from("group_members")
      .select(`
        group_id,
        user_id,
        role,
        joined_at
      `)
      .eq(
        "group_id",
        state.group.id
      );


  if (membersResult.error) {

    throw membersResult.error;

  }


  const userIds =
    membersResult.data.map(
      member =>
        member.user_id
    );


  /*
    Get profiles.
  */

  let profiles = [];


  if (userIds.length) {

    const profilesResult =
      await client
        .from("profiles")
        .select(`
          id,
          display_name,
          avatar_url,
          created_at
        `)
        .in(
          "id",
          userIds
        );


    if (profilesResult.error) {

      throw profilesResult.error;

    }


    profiles =
      profilesResult.data || [];
  }


  const profileMap = {};


  profiles.forEach(profile => {

    profileMap[profile.id] =
      profile;

  });


  state.members =
    membersResult.data.map(member => ({

      ...member,

      profiles:
        profileMap[member.user_id] ||
        null

    }));


  /*
    Get games.
  */

  const gamesResult =
    await client
      .from("games")
      .select("*")
      .eq(
        "group_id",
        state.group.id
      )
      .order(
        "played_at",
        {
          ascending: false
        }
      );


  if (gamesResult.error) {

    throw gamesResult.error;

  }


  state.games =
    gamesResult.data || [];


  state.profile =
    profileMap[state.user.id] ||
    null;
}


/* ============================================================
   REFRESH
============================================================ */

async function refresh() {

  try {

    const sessionResult =
      await client.auth.getSession();


    if (sessionResult.error) {

      throw sessionResult.error;

    }


    state.user =
      sessionResult.data.session?.user ||
      null;


    if (!state.user) {

      renderAuth();

      return;

    }


    await loadData();


    if (!state.group) {

      renderGroupSetup();

      return;

    }


    renderCurrentPage();

  } catch (error) {

    console.error(
      "Routine 721 error:",
      error
    );


    $("#app").innerHTML = `

      <div class="auth-screen">

        <div class="auth-box">

          <div class="kicker">
            Routine 721
          </div>

          <div class="brand">
            WAR ROOM
          </div>

          <p class="red">
            Something went wrong while loading the War Room.
          </p>

          <div class="error">

            ${escapeHTML(
              error.message ||
              String(error)
            )}

          </div>

          <br>

          <button
            class="btn primary"
            onclick="location.reload()"
          >
            Try Again
          </button>

        </div>

      </div>

    `;
  }
}


/* ============================================================
   PAGE ROUTER
============================================================ */

function renderCurrentPage() {

  if (!state.group) {

    renderGroupSetup();

    return;

  }


  renderShell();


  document
    .querySelectorAll("[data-view]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.view ===
        state.view
      );

    });


  if (state.view === "dashboard") {

    renderDashboard();

  } else if (
    state.view === "games"
  ) {

    renderGames();

  } else if (
    state.view === "players"
  ) {

    renderPlayers();

  } else if (
    state.view === "factions"
  ) {

    renderFactions();

  } else if (
    state.view === "group"
  ) {

    renderGroup();

  } else {

    state.view = "dashboard";

    renderDashboard();

  }
}

============================================================ */

client.auth.onAuthStateChange(

    /*
      Delay prevents Supabase's auth event
      from colliding with initial page loading.
    */

    setTimeout(
      refresh,
      100
    );

  }
);

refresh();
