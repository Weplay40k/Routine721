<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routine 721 — War Room</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#07080a;--panel:#111318;--panel2:#17191f;--line:#34343a;--text:#eee9dc;--muted:#92908a;--red:#9e2935;--red2:#d34b55;--gold:#c5a35a;--green:#8dbd8b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0,#351018 0,transparent 30%),radial-gradient(circle at 90% 0,#172033 0,transparent 28%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 5px);mix-blend-mode:screen}button,input,select,textarea{font:inherit}button{cursor:pointer}.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);padding:38px;background:linear-gradient(145deg,#121318,#090a0d);border:1px solid #51423b;border-radius:4px;box-shadow:0 30px 90px #000c}.sigil{text-align:center;font-size:46px;color:var(--gold);text-shadow:0 0 20px #9e293555}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--red2);font-weight:900}.login-card .eyebrow{text-align:center;margin-top:8px}.login-card h1{text-align:center;font-size:31px;letter-spacing:5px;margin:10px 0 5px}.login-card h1 span{color:var(--red2)}.muted{color:var(--muted);text-align:center;font-size:11px;letter-spacing:3px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:28px 0 20px}.tabs button,.secondary{border:1px solid var(--line);background:#17191d;color:#c2bfb6;padding:11px;border-radius:3px}.tabs button.active{background:#3b1319;border-color:#8d3039;color:#fff}.login-card label,.form-grid label{display:block;color:#aaa79e;font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin:14px 0}.login-card input,.form-grid input,.form-grid select,.form-grid textarea{width:100%;margin-top:7px;background:#08090b;color:#fff;border:1px solid #3a3a40;border-radius:3px;padding:12px;outline:none}.form-grid textarea{min-height:100px;resize:vertical}.primary{border:1px solid var(--red2);background:linear-gradient(180deg,#aa303b,#741d27);color:#fff;border-radius:3px;padding:12px 16px;font-weight:900;letter-spacing:1px}.login-card .primary{width:100%;margin-top:14px}.notice{min-height:20px;text-align:center;color:var(--muted);font-size:11px;margin-top:14px}.notice.error{color:#f07b83}.notice.success{color:#a9d6a3}.topbar{height:76px;border-bottom:1px solid var(--line);background:#090a0dec;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:900;letter-spacing:4px}.brand-sub{font-size:8px;letter-spacing:2px;color:var(--muted);margin-top:4px}.user-area{display:flex;align-items:center;gap:10px;color:#d0cdc4;font-size:11px}.mini-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#3b141a;border:1px solid #8c3a42;color:#fff;font-weight:900}.layout{display:flex;min-height:calc(100vh - 76px)}.sidebar{width:235px;flex:none;padding:22px 14px;background:#090a0c;border-right:1px solid var(--line)}.sidebar-label{font-size:9px;color:#77756f;letter-spacing:2px;font-weight:900;padding:0 10px 14px}.nav-button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#99978f;padding:12px 11px;border-radius:3px;margin-bottom:5px;font-size:10px;font-weight:900;letter-spacing:1px}.nav-button:hover,.nav-button.active{background:#2a1116;border-color:#69252e;color:#fff}.nav-button i{display:inline-block;width:22px;color:var(--gold);font-style:normal}.content{flex:1;min-width:0;padding:28px}.content-title{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.content-title h1{margin:6px 0 0;font-size:27px;letter-spacing:3px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px;background:linear-gradient(135deg,#19151a,#0d1015);border:1px solid #3b383d;border-radius:4px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"IMPERIAL COMMAND";position:absolute;right:-20px;bottom:-14px;font-size:60px;font-weight:900;color:#fff;opacity:.025;letter-spacing:3px}.hero h2{margin:8px 0;font-size:24px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stats article{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;position:relative}.stats small{display:block;color:#777871;font-size:9px;letter-spacing:2px}.stats b{display:block;font-size:28px;margin-top:7px}.stats .rate b{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.panel-head h3{margin:0;font-size:15px;letter-spacing:2px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #3b3b41;border-radius:3px}.game-row,.rank-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 4px;border-bottom:1px solid #292a2f}.game-row:last-child,.rank-row:last-child{border-bottom:0}.game-row span,.game-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.result{font-size:10px}.result.win{color:var(--green)}.result.loss{color:#ed747c}.result.draw{color:var(--gold)}.player-grid,.group-grid,.faction-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.player-card,.group-card,.faction-grid article{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:18px}.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:#3a1218;border:1px solid #81323b;color:#fff;font-weight:900;font-size:20px}.player-card h3,.group-card h3,.faction-grid h3{margin:12px 0 6px}.player-card p,.group-card span,.faction-grid b{font-size:10px;color:var(--muted)}.player-stats{display:flex;justify-content:space-between;margin-top:18px;font-size:9px;color:#747780}.player-stats strong{color:var(--gold)}.winrate{margin-top:10px;color:var(--gold);font-size:10px;font-weight:900;letter-spacing:1px}.faction-grid article span{font-size:25px;color:var(--gold)}.table{border-top:1px solid var(--line)}.rank-row{display:grid;grid-template-columns:45px 1fr 150px 130px 50px}.rank-row b,.rank-row em{color:var(--gold);font-style:normal}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.form-grid .wide{grid-column:1/-1}.field-help{display:block;color:#6f7075;font-size:9px;margin-top:6px}.profile-dossier{max-width:1000px}.profile-hero{display:flex;align-items:center;gap:20px;padding:24px;margin-bottom:18px;background:linear-gradient(135deg,#1a1519,#0e1013);border:1px solid var(--line);border-radius:4px}.profile-avatar{width:112px;height:112px;border-radius:6px;object-fit:cover;display:grid;place-items:center;background:#3a1218;border:1px solid #8d3740;color:#fff;font-size:34px;font-weight:900}.profile-hero h2{margin:7px 0;font-size:28px;letter-spacing:2px}.profile-hero p{margin:0;color:var(--muted)}.faction-roster{display:flex;flex-wrap:wrap;gap:8px}.faction-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #4a3d31;background:#201b15;color:#d9c28d;border-radius:3px;font-size:10px}.faction-chip button{border:0;background:transparent;color:#d17a80;padding:0;font-size:16px}.profile-stats{grid-template-columns:repeat(4,1fr)}#modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:20px;z-index:20}#modal[hidden]{display:none}.modal-card{width:min(700px,100%);max-height:90vh;overflow:auto;background:#101217;border:1px solid #49434a;border-radius:4px;padding:22px}
@media(max-width:760px){.topbar{padding:12px 15px;height:auto}.user-area span{display:none}.layout{display:block}.sidebar{width:100%;padding:8px;display:flex;overflow-x:auto;gap:5px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:4}.sidebar-label{display:none}.nav-button{white-space:nowrap;width:auto;margin:0;padding:10px 12px;font-size:9px}.content{padding:14px}.content-title h1{font-size:21px}.hero{display:block;padding:18px}.hero .primary{margin-top:15px;width:100%}.stats,.profile-stats{grid-template-columns:repeat(2,1fr)}.player-grid,.group-grid,.faction-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-card,.group-card,.faction-grid article{padding:14px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.login-card{padding:26px 20px}.rank-row{grid-template-columns:30px 1fr 55px;font-size:10px}.rank-row span,.rank-row em{display:none}.profile-hero{align-items:flex-start}.profile-avatar{width:82px;height:82px}.brand{font-size:16px}.stats article{padding:14px}.stats b{font-size:23px}}

</style></head><body><div id="boot"><div class="login-shell"><div class="login-card"><div class="sigil">⚔</div><div class="eyebrow">ROUTINE 721</div><h1>WAR ROOM</h1><p class="muted">INITIALISING COMMAND TERMINAL…</p></div></div></div><script src="app-v2.js"></script></body></html>
