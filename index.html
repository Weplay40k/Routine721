<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/*
=========================================================
SUPABASE CONFIGURATION
=========================================================
*/

const SUPABASE_URL =
    "https://jbgwdxavydhtvoqpbfmj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Wt8h6fNelT6zrzf-Dm8FXw_cdSGylaz";


/*
IMPORTANT:

We use "supabaseClient" instead of "supabase".

This avoids the global-name collision
you previously encountered.
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
=========================================================
ELEMENTS
=========================================================
*/

const loginView =
    document.getElementById("loginView");

const createView =
    document.getElementById("createView");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const createEmail =
    document.getElementById("createEmail");

const createPassword =
    document.getElementById("createPassword");

const signInButton =
    document.getElementById("signInButton");

const showCreateButton =
    document.getElementById("showCreateButton");

const createAccountButton =
    document.getElementById("createAccountButton");

const backButton =
    document.getElementById("backButton");

const status =
    document.getElementById("status");


/*
=========================================================
STATUS FUNCTION
=========================================================
*/

function setStatus(
    message,
    type = ""
) {

    status.textContent = message;

    status.className = type;

}


/*
=========================================================
SHOW CREATE ACCOUNT
=========================================================
*/

showCreateButton.addEventListener(
    "click",
    function () {

        loginView.classList.add("hidden");

        createView.classList.remove("hidden");

        setStatus("");

    }
);


/*
=========================================================
BACK TO LOGIN
=========================================================
*/

backButton.addEventListener(
    "click",
    function () {

        createView.classList.add("hidden");

        loginView.classList.remove("hidden");

        setStatus("");

    }
);


/*
=========================================================
SIGN IN
=========================================================
*/

signInButton.addEventListener(
    "click",
    async function () {

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;


        if (!email || !password) {

            setStatus(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        signInButton.disabled = true;

        signInButton.textContent =
            "SIGNING IN...";


        try {

            const result =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (result.error) {

                setStatus(
                    result.error.message,
                    "error"
                );

                return;

            }


            setStatus(
                "Signed in successfully.",
                "success"
            );

        }

        catch (error) {

            setStatus(
                "Login error: " +
                error.message,
                "error"
            );

        }

        finally {

            signInButton.disabled = false;

            signInButton.textContent =
                "SIGN IN";

        }

    }
);


/*
=========================================================
CREATE ACCOUNT
=========================================================
*/

createAccountButton.addEventListener(
    "click",
    async function () {

        const email =
            createEmail.value.trim();

        const password =
            createPassword.value;


        if (!email || !password) {

            setStatus(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        if (password.length < 6) {

            setStatus(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }


        createAccountButton.disabled = true;

        createAccountButton.textContent =
            "CREATING...";


        try {

            const result =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


            if (result.error) {

                setStatus(
                    result.error.message,
                    "error"
                );

                return;

            }


            if (
                result.data.user &&
                !result.data.session
            ) {

                setStatus(
                    "Account created. Check your email to confirm your account.",
                    "success"
                );

            }

            else {

                setStatus(
                    "Account created successfully.",
                    "success"
                );

            }

        }

        catch (error) {

            setStatus(
                "Account error: " +
                error.message,
                "error"
            );

        }

        finally {

            createAccountButton.disabled = false;

            createAccountButton.textContent =
                "CREATE ACCOUNT";

        }

    }
);


/*
=========================================================
ENTER KEY
=========================================================
*/

loginPassword.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            signInButton.click();

        }

    }
);


createPassword.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            createAccountButton.click();

        }

    }
);


/*
=========================================================
CHECK SUPABASE
=========================================================
*/

async function checkSupabase() {

    try {

        const result =
            await supabaseClient.auth.getSession();


        if (result.error) {

            setStatus(
                "Supabase error: " +
                result.error.message,
                "error"
            );

            return;

        }


        if (result.data.session) {

            setStatus(
                "Supabase authentication is working.",
                "success"
            );

        }

        else {

            setStatus(
                "SUPABASE CONNECTED ✓",
                "success"
            );

        }

    }

    catch (error) {

        setStatus(
            "Connection error: " +
            error.message,
            "error"
        );

    }

}


checkSupabase();

</script>


</body>
