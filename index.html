<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#030305"
>

<title>Routine 721 — War Room</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {

    overflow: hidden;

    background: #020204;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   WARP CANVAS
   ========================================================= */

#warpCanvas {

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100vh;

    display: block;

    z-index: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            #130b20 0%,
            #07060c 38%,
            #020204 78%
        );
}


/* =========================================================
   SMOKE / VOID
   ========================================================= */

#void {

    position: fixed;

    inset: -20%;

    z-index: 1;

    pointer-events: none;

    opacity: 0.9;

    background:

        radial-gradient(
            ellipse at 15% 45%,
            rgba(105, 20, 150, 0.20),
            transparent 34%
        ),

        radial-gradient(
            ellipse at 85% 40%,
            rgba(180, 20, 25, 0.18),
            transparent 34%
        ),

        radial-gradient(
            ellipse at 30% 85%,
            rgba(15, 90, 210, 0.14),
            transparent 30%
        ),

        radial-gradient(
            ellipse at 75% 80%,
            rgba(20, 170, 80, 0.10),
            transparent 30%
        );

    filter: blur(25px);

    animation:
        voidMove 12s ease-in-out infinite alternate;
}


@keyframes voidMove {

    0% {

        transform:
            scale(1)
            rotate(0deg);

        filter:
            blur(25px)
            hue-rotate(0deg);
    }

    50% {

        transform:
            scale(1.08)
            rotate(2deg);

        filter:
            blur(35px)
            hue-rotate(12deg);
    }

    100% {

        transform:
            scale(1.02)
            rotate(-2deg);

        filter:
            blur(28px)
            hue-rotate(-10deg);
    }
}


/* =========================================================
   WARP VORTEX VISUAL RINGS
   ========================================================= */

.vortex {

    position: fixed;

    left: 50%;
    top: 50%;

    width: min(850px, 130vw);
    height: min(520px, 85vw);

    z-index: 2;

    pointer-events: none;

    transform:
        translate(-50%, -50%)
        rotate(-8deg);

    border-radius: 50%;

    border:
        1px solid
        rgba(170, 40, 255, 0.22);

    box-shadow:

        0 0 35px
        rgba(150, 30, 255, 0.16),

        inset 0 0 50px
        rgba(150, 30, 255, 0.08);

    animation:
        vortexSpin 9s linear infinite;
}


.vortex::before {

    content: "";

    position: absolute;

    inset: 6%;

    border-radius: 50%;

    border:
        2px solid
        rgba(255, 35, 35, 0.18);

    box-shadow:

        0 0 30px
        rgba(255, 25, 25, 0.12),

        inset 0 0 35px
        rgba(255, 25, 25, 0.08);

    animation:
        vortexCounter 6s linear infinite;
}


.vortex::after {

    content: "";

    position: absolute;

    inset: 15%;

    border-radius: 50%;

    border:
        1px solid
        rgba(30, 130, 255, 0.22);

    box-shadow:

        0 0 30px
        rgba(20, 120, 255, 0.16),

        inset 0 0 40px
        rgba(20, 120, 255, 0.08);

    animation:
        vortexSpin 5s linear infinite reverse;
}


@keyframes vortexSpin {

    from {

        transform:
            translate(-50%, -50%)
            rotate(-8deg);
    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(352deg);
    }
}


@keyframes vortexCounter {

    from {

        transform:
            rotate(0deg)
            scale(1);
    }

    50% {

        transform:
            rotate(-180deg)
            scale(0.94);
    }

    to {

        transform:
            rotate(-360deg)
            scale(1);
    }
}


/* =========================================================
   CENTRAL WARP RIFT
   ========================================================= */

#rift {

    position: fixed;

    left: 50%;
    top: 50%;

    width: min(460px, 75vw);
    height: min(460px, 75vw);

    z-index: 3;

    pointer-events: none;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(2, 1, 5, 0.98) 0%,
            rgba(8, 2, 15, 0.92) 34%,
            rgba(100, 20, 160, 0.16) 53%,
            rgba(210, 20, 40, 0.08) 67%,
            transparent 76%
        );

    box-shadow:

        0 0 40px
        rgba(150, 20, 255, 0.20),

        0 0 90px
        rgba(90, 20, 255, 0.13);

    animation:
        riftPulse 3.5s ease-in-out infinite;
}


@keyframes riftPulse {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.94);

        filter:
            brightness(0.9);
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.06);

        filter:
            brightness(1.25);
    }
}


/* =========================================================
   LOGIN CONTAINER
   ========================================================= */

.login-layer {

    position: relative;

    z-index: 20;

    width: 100%;
    height: 100%;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


/* =========================================================
   LOGIN BOX
   ========================================================= */

.login-box {

    position: relative;

    width: min(440px, 94vw);

    padding: 36px 32px;

    background:
        linear-gradient(
            145deg,
            rgba(12, 11, 16, 0.97),
            rgba(4, 4, 7, 0.985)
        );

    border:
        1px solid
        rgba(201, 168, 76, 0.58);

    border-radius: 8px;

    box-shadow:

        0 30px 100px
        rgba(0, 0, 0, 0.95),

        0 0 35px
        rgba(150, 30, 255, 0.12),

        inset 0 0 35px
        rgba(0, 0, 0, 0.75);

    backdrop-filter:
        blur(10px);
}


/* glowing corners */

.login-box::before,
.login-box::after {

    content: "";

    position: absolute;

    width: 70px;
    height: 70px;

    pointer-events: none;
}


.login-box::before {

    top: -1px;
    left: -1px;

    border-top:
        2px solid
        #c9a84c;

    border-left:
        2px solid
        #c9a84c;
}


.login-box::after {

    right: -1px;
    bottom: -1px;

    border-right:
        2px solid
        #c9a84c;

    border-bottom:
        2px solid
        #c9a84c;
}


/* =========================================================
   TITLE
   ========================================================= */

.logo {

    margin: 0;

    text-align: center;

    color: #c9a84c;

    font-size: 31px;

    letter-spacing: 7px;

    text-shadow:

        0 0 8px
        rgba(201, 168, 76, 0.35),

        0 0 22px
        rgba(201, 168, 76, 0.15);
}


.subtitle {

    margin-top: 8px;

    margin-bottom: 28px;

    text-align: center;

    color: #777;

    font-size: 11px;

    letter-spacing: 6px;
}


.divider {

    height: 1px;

    margin:
        0
        10px
        25px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(201,168,76,0.55),
            transparent
        );
}


/* =========================================================
   FORM
   ========================================================= */

h2 {

    margin:
        0
        0
        8px;

    text-align: center;

    color: #e5e5e5;

    font-size: 20px;

    letter-spacing: 2px;
}


.description {

    margin:
        0
        0
        22px;

    text-align: center;

    color: #777;

    font-size: 12px;

    line-height: 1.6;
}


label {

    display: block;

    margin:
        16px
        0
        6px;

    color: #999;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


input {

    width: 100%;

    height: 45px;

    padding:
        0
        13px;

    border:
        1px solid
        #34343a;

    border-radius: 4px;

    outline: none;

    background:
        rgba(2, 2, 4, 0.95);

    color: white;

    font-size: 14px;

    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}


input:focus {

    border-color:
        #8d5cff;

    box-shadow:

        0 0 10px
        rgba(140, 60, 255, 0.22),

        inset 0 0 10px
        rgba(140, 60, 255, 0.05);
}


input::placeholder {

    color: #555;
}


/* =========================================================
   BUTTONS
   ========================================================= */

button {

    width: 100%;

    height: 45px;

    margin-top: 16px;

    border-radius: 4px;

    cursor: pointer;

    font-weight: bold;

    font-size: 12px;

    letter-spacing: 2px;

    transition:
        transform 0.15s,
        filter 0.15s,
        box-shadow 0.15s;
}


button:hover {

    filter: brightness(1.18);

    transform:
        translateY(-1px);
}


button:active {

    transform:
        translateY(1px);
}


button:disabled {

    opacity: 0.5;

    cursor: wait;

    transform: none;
}


.primary {

    border:
        1px solid
        #c54a3c;

    background:
        linear-gradient(
            180deg,
            #a63b2e,
            #681b16
        );

    color: white;

    box-shadow:
        0 0 15px
        rgba(180, 40, 25, 0.12);
}


.secondary {

    border:
        1px solid
        #3b3b42;

    background:
        linear-gradient(
            180deg,
            #25252a,
            #111114
        );

    color: #bbb;
}


.logout {

    border:
        1px solid
        #5b2830;

    background:
        #160a0c;

    color: #ff8a8a;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {

    min-height: 18px;

    margin-top: 18px;

    text-align: center;

    color: #666;

    font-size: 11px;

    line-height: 1.5;
}


#status.success {

    color: #61df86;

    text-shadow:
        0 0 8px
        rgba(80, 220, 120, 0.25);
}


#status.error {

    color: #ff6262;
}


.hidden {

    display: none !important;
}


/* =========================================================
   AUTHENTICATED SCREEN
   ========================================================= */

.war-room {

    text-align: center;
}


.war-room h2 {

    color: #c9a84c;

    font-size: 25px;

    letter-spacing: 4px;
}


.war-room .access {

    margin:
        15px
        0
        25px;

    color: #5fe28a;

    font-size: 11px;

    letter-spacing: 3px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .login-layer {

        padding: 12px;
    }


    .login-box {

        padding:
            30px
            20px;
    }


    .logo {

        font-size: 25px;

        letter-spacing: 5px;
    }


    .subtitle {

        letter-spacing: 4px;
    }


    #rift {

        width: 350px;
        height: 350px;
    }


    .vortex {

        width: 600px;
        height: 380px;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    #void,
    .vortex,
    #rift {

        animation-duration:
            20s;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     WARP BACKGROUND
     ======================================================= -->

<canvas id="warpCanvas"></canvas>

<div id="void"></div>

<div class="vortex"></div>

<div id="rift"></div>


<!-- =======================================================
     LOGIN
     ======================================================= -->

<div class="login-layer">

    <main class="login-box">


        <!-- LOGIN VIEW -->

        <section id="loginView">

            <h1 class="logo">
                ROUTINE 721
            </h1>

            <div class="subtitle">
                WAR ROOM
            </div>

            <div class="divider"></div>

            <h2>
                WELCOME BACK
            </h2>

            <p class="description">
                Enter your credentials to access the War Room.
            </p>


            <label for="loginEmail">
                Email
            </label>

            <input
                id="loginEmail"
                type="email"
                autocomplete="email"
                placeholder="your@email.com"
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                placeholder="Password"
            >


            <button
                id="signInButton"
                class="primary"
                type="button"
            >
                SIGN IN
            </button>


            <button
                id="showCreateButton"
                class="secondary"
                type="button"
            >
                CREATE ACCOUNT
            </button>

        </section>


        <!-- CREATE ACCOUNT VIEW -->

        <section
            id="createView"
            class="hidden"
        >

            <h1 class="logo">
                ROUTINE 721
            </h1>

            <div class="subtitle">
                WAR ROOM
            </div>

            <div class="divider"></div>

            <h2>
                JOIN THE WAR ROOM
            </h2>

            <p class="description">
                Create your account and enter the battlefield.
            </p>


            <label for="createEmail">
                Email
            </label>

            <input
                id="createEmail"
                type="email"
                autocomplete="email"
                placeholder="your@email.com"
            >


            <label for="createPassword">
                Password
            </label>

            <input
                id="createPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Choose a password"
            >


            <button
                id="createAccountButton"
                class="primary"
                type="button"
            >
                CREATE ACCOUNT
            </button>


            <button
                id="backButton"
                class="secondary"
                type="button"
            >
                BACK TO SIGN IN
            </button>

        </section>


        <!-- AUTHENTICATED VIEW -->

        <section
            id="warRoomView"
            class="war-room hidden"
        >

            <h1 class="logo">
                ROUTINE 721
            </h1>

            <div class="subtitle">
                WAR ROOM
            </div>

            <div class="divider"></div>

            <h2>
                ACCESS GRANTED
            </h2>

            <div class="access">
                SUPABASE AUTHENTICATION ACTIVE
            </div>

            <p id="userEmail">
                Authenticated user
            </p>

            <button
                id="logoutButton"
                class="logout"
                type="button"
            >
                SIGN OUT
            </button>

        </section>


        <div
            id="status"
            aria-live="polite"
        >
            Connecting to database...
        </div>


    </main>

</div>


<!-- =======================================================
     SUPABASE
     ======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
    "https://jbgwdxavydhtvoqpbfmj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Wt8h6fNelT6zrzf-Dm8FXw_cdSGylaz";


/*
IMPORTANT:

Use "supabaseClient".

Do NOT call this variable "supabase".
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   DOM
   ========================================================= */

const loginView =
    document.getElementById(
        "loginView"
    );

const createView =
    document.getElementById(
        "createView"
    );

const warRoomView =
    document.getElementById(
        "warRoomView"
    );

const loginEmail =
    document.getElementById(
        "loginEmail"
    );

const loginPassword =
    document.getElementById(
        "loginPassword"
    );

const createEmail =
    document.getElementById(
        "createEmail"
    );

const createPassword =
    document.getElementById(
        "createPassword"
    );

const signInButton =
    document.getElementById(
        "signInButton"
    );

const showCreateButton =
    document.getElementById(
        "showCreateButton"
    );

const createAccountButton =
    document.getElementById(
        "createAccountButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const status =
    document.getElementById(
        "status"
    );

const userEmail =
    document.getElementById(
        "userEmail"
    );


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
    message,
    type = ""
) {

    status.textContent =
        message;

    status.className =
        type;
}


/* =========================================================
   VIEW MANAGEMENT
   ========================================================= */

function showLogin() {

    loginView.classList.remove(
        "hidden"
    );

    createView.classList.add(
        "hidden"
    );

    warRoomView.classList.add(
        "hidden"
    );
}


function showCreate() {

    loginView.classList.add(
        "hidden"
    );

    createView.classList.remove(
        "hidden"
    );

    warRoomView.classList.add(
        "hidden"
    );

    createEmail.focus();
}


function showWarRoom(
    user
) {

    loginView.classList.add(
        "hidden"
    );

    createView.classList.add(
        "hidden"
    );

    warRoomView.classList.remove(
        "hidden"
    );

    if (user && user.email) {

        userEmail.textContent =
            user.email;

    }

    setStatus(
        "Supabase authentication is working.",
        "success"
    );
}


/* =========================================================
   CREATE ACCOUNT VIEW
   ========================================================= */

showCreateButton.addEventListener(
    "click",
    function () {

        setStatus("");

        showCreate();

    }
);


/* =========================================================
   BACK TO LOGIN
   ========================================================= */

backButton.addEventListener(
    "click",
    function () {

        setStatus("");

        showLogin();

        loginEmail.focus();

    }
);


/* =========================================================
   SIGN IN
   ========================================================= */

signInButton.addEventListener(
    "click",
    async function () {

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;


        if (!email) {

            setStatus(
                "Enter your email address.",
                "error"
            );

            loginEmail.focus();

            return;
        }


        if (!password) {

            setStatus(
                "Enter your password.",
                "error"
            );

            loginPassword.focus();

            return;
        }


        signInButton.disabled =
            true;

        signInButton.textContent =
            "ENTERING WAR ROOM...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email,
                    password

                });


            if (error) {

                setStatus(
                    error.message,
                    "error"
                );

                return;
            }


            showWarRoom(
                data.user
            );

        }

        catch (error) {

            setStatus(
                "Login error: " +
                error.message,
                "error"
            );

        }

        finally {

            signInButton.disabled =
                false;

            signInButton.textContent =
                "SIGN IN";

        }

    }
);


/* =========================================================
   CREATE ACCOUNT
   ========================================================= */

createAccountButton.addEventListener(
    "click",
    async function () {

        const email =
            createEmail.value.trim();

        const password =
            createPassword.value;


        if (!email) {

            setStatus(
                "Enter your email address.",
                "error"
            );

            createEmail.focus();

            return;
        }


        if (!password) {

            setStatus(
                "Choose a password.",
                "error"
            );

            createPassword.focus();

            return;
        }


        if (password.length < 6) {

            setStatus(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        createAccountButton.disabled =
            true;

        createAccountButton.textContent =
            "CREATING ACCOUNT...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email,
                    password

                });


            if (error) {

                setStatus(
                    error.message,
                    "error"
                );

                return;
            }


            /*
            If email confirmation is enabled
            in Supabase, there will be no session yet.
            */

            if (
                data.user &&
                !data.session
            ) {

                setStatus(
                    "Account created. Check your email to confirm your account.",
                    "success"
                );

            }

            else if (data.user) {

                showWarRoom(
                    data.user
                );

            }

            else {

                setStatus(
                    "Account created.",
                    "success"
                );

            }

        }

        catch (error) {

            setStatus(
                "Account error: " +
                error.message,
                "error"
            );

        }

        finally {

            createAccountButton.disabled =
                false;

            createAccountButton.textContent =
                "CREATE ACCOUNT";

        }

    }
);


/* =========================================================
   SIGN OUT
   ========================================================= */

logoutButton.addEventListener(
    "click",
    async function () {

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "SIGNING OUT...";


        try {

            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                setStatus(
                    error.message,
                    "error"
                );

                return;
            }


            showLogin();

            loginEmail.focus();

            setStatus(
                "Signed out.",
                "success"
            );

        }

        catch (error) {

            setStatus(
                "Sign out error: " +
                error.message,
                "error"
            );

        }

        finally {

            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "SIGN OUT";

        }

    }
);


/* =========================================================
   ENTER KEY
   ========================================================= */

loginPassword.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            signInButton.click();

        }

    }
);


createPassword.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            createAccountButton.click();

        }

    }
);


/* =========================================================
   AUTH STATE
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
    function (
        event,
        session
    ) {

        if (
            session &&
            session.user
        ) {

            showWarRoom(
                session.user
            );

        }

    }
);


/* =========================================================
   INITIAL SUPABASE CHECK
   ========================================================= */

async function initialiseAuth() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            setStatus(
                "Supabase error: " +
                error.message,
                "error"
            );

            return;
        }


        if (
            data.session &&
            data.session.user
        ) {

            showWarRoom(
                data.session.user
            );

        }

        else {

            showLogin();

            setStatus(
                "SUPABASE CONNECTED ✓",
                "success"
            );

        }

    }

    catch (error) {

        setStatus(
            "Connection error: " +
            error.message,
            "error"
        );

    }

}


initialiseAuth();


/* =========================================================
   WARP PARTICLE ENGINE
   ========================================================= */

const canvas =
    document.getElementById(
        "warpCanvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


let width = 0;
let height = 0;
let centerX = 0;
let centerY = 0;

let particles = [];

let shockwaves = [];

let lastTime = 0;


/* =========================================================
   COLOURS
   ========================================================= */

const warpColors = [

    "#9b3cff",
    "#c44cff",
    "#e879f9",

    "#ff2020",
    "#ff4545",
    "#b5122a",

    "#1976ff",
    "#32a7ff",

    "#21ff78",
    "#48ff9b"

];


/* =========================================================
   RESIZE
   ========================================================= */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        window.innerWidth;

    height =
        window.innerHeight;


    centerX =
        width / 2;

    centerY =
        height / 2;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    createParticles();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   PARTICLE CREATION
   ========================================================= */

function createParticle() {

    const angle =
        Math.random() *
        Math.PI *
        2;


    const radius =
        80 +
        Math.random() *
        Math.max(
            width,
            height
        ) *
        0.48;


    return {

        angle,

        radius,

        speed:
            0.08 +
            Math.random() *
            0.20,

        spin:
            (Math.random() > 0.5
                ? 1
                : -1) *
            (
                0.0015 +
                Math.random() *
                0.004
            ),

        size:
            0.7 +
            Math.random() *
            2.7,

        alpha:
            0.25 +
            Math.random() *
            0.75,

        color:
            warpColors[
                Math.floor(
                    Math.random() *
                    warpColors.length
                )
            ],

        wobble:
            Math.random() *
            Math.PI *
            2,

        wobbleSpeed:
            0.002 +
            Math.random() *
            0.009,

        turbulence:
            10 +
            Math.random() *
            55,

        length:
            5 +
            Math.random() *
            35

    };

}


/* =========================================================
   CREATE PARTICLES
   ========================================================= */

function createParticles() {

    particles = [];

    const mobile =
        width < 650;


    const amount =
        mobile
            ? 230
            : 430;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const p =
            createParticle();


        /*
        Spread particles throughout
        the vortex immediately.
        */

        p.radius =
            50 +
            Math.random() *
            Math.max(
                width,
                height
            ) *
            0.65;


        p.angle =
            Math.random() *
            Math.PI *
            2;


        particles.push(p);

    }

}


/* =========================================================
   SHOCKWAVE
   ========================================================= */

function createShockwave() {

    shockwaves.push({

        radius: 20,

        alpha: 0.5,

        speed:
            3 +
            Math.random() * 5,

        color:
            warpColors[
                Math.floor(
                    Math.random() *
                    warpColors.length
                )
            ]

    });

}


/* =========================================================
   RANDOM SHOCKWAVES
   ========================================================= */

setInterval(
    function () {

        if (
            Math.random() <
            0.75
        ) {

            createShockwave();

        }

    },
    1600
);


/* =========================================================
   DRAW PARTICLE
   ========================================================= */

function drawParticle(
    p,
    time
) {

    /*
    Slowly rotate the particle
    around the central rift.
    */

    p.angle +=
        p.spin *
        16;


    /*
    Pull particles inward/outward
    in a breathing Warp motion.
    */

    p.radius -=
        p.speed *
        2;


    if (
        p.radius < 45
    ) {

        p.radius =
            Math.max(
                width,
                height
            ) *
            (
                0.38 +
                Math.random() *
                0.35
            );

        p.angle =
            Math.random() *
            Math.PI *
            2;

    }


    p.wobble +=
        p.wobbleSpeed *
        16;


    /*
    Turbulence makes the path
    bend rather than forming
    a perfect circle.
    */

    const turbulence =
        Math.sin(
            p.wobble
        ) *
        p.turbulence;


    const angle =
        p.angle +
        Math.sin(
            time * 0.00025 +
            p.wobble
        ) *
        0.15;


    const x =
        centerX +
        Math.cos(angle) *
        (
            p.radius +
            turbulence
        );


    const y =
        centerY +
        Math.sin(angle) *
        (
            p.radius *
            0.58 +
            turbulence *
            0.45
        );


    /*
    Tangent direction of the
    particle around the vortex.
    */

    const tx =
        -Math.sin(angle);

    const ty =
        Math.cos(angle);


    const tail =
        p.length *
        (
            0.6 +
            p.radius /
            Math.max(
                width,
                height
            )
        );


    const endX =
        x -
        tx *
        tail;


    const endY =
        y -
        ty *
        tail;


    const gradient =
        ctx.createLinearGradient(
            endX,
            endY,
            x,
            y
        );


    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    gradient.addColorStop(
        0.45,
        p.color
    );


    gradient.addColorStop(
        1,
        "#ffffff"
    );


    ctx.save();

    ctx.globalAlpha =
        p.alpha;

    ctx.strokeStyle =
        gradient;

    ctx.lineWidth =
        p.size;

    ctx.shadowBlur =
        12;

    ctx.shadowColor =
        p.color;


    ctx.beginPath();

    ctx.moveTo(
        endX,
        endY
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.stroke();


    /*
    Bright ember head.
    */

    ctx.globalAlpha =
        Math.min(
            1,
            p.alpha *
            1.2
        );

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowBlur =
        16;

    ctx.shadowColor =
        p.color;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        p.size *
        0.8,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   DRAW SHOCKWAVES
   ========================================================= */

function drawShockwaves() {

    for (
        let i =
            shockwaves.length - 1;

        i >= 0;

        i--
    ) {

        const wave =
            shockwaves[i];


        wave.radius +=
            wave.speed;

        wave.alpha *=
            0.985;


        if (
            wave.alpha <
                0.02
        ) {

            shockwaves.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            wave.alpha;

        ctx.strokeStyle =
            wave.color;

        ctx.shadowBlur =
            25;

        ctx.shadowColor =
            wave.color;

        ctx.lineWidth =
            1.5;


        ctx.beginPath();

        ctx.ellipse(

            centerX,

            centerY,

            wave.radius,

            wave.radius *
                0.55,

            -0.12,

            0,
            Math.PI * 2

        );

        ctx.stroke();


        ctx.restore();

    }

}


/* =========================================================
   DARK CENTRAL VOID
   ========================================================= */

function drawVoid() {

    const max =
        Math.max(
            width,
            height
        );


    const gradient =
        ctx.createRadialGradient(

            centerX,
            centerY,
            10,

            centerX,
            centerY,
            max * 0.55

        );


    gradient.addColorStop(
        0,
        "rgba(0,0,0,0.98)"
    );


    gradient.addColorStop(
        0.28,
        "rgba(8,2,15,0.75)"
    );


    gradient.addColorStop(
        0.55,
        "rgba(25,5,35,0.20)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.save();

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    ctx.restore();

}


/* =========================================================
   OCCASIONAL ENERGY FLASH
   ========================================================= */

let flash = 0;

setInterval(
    function () {

        if (
            Math.random() <
            0.35
        ) {

            flash =
                0.12 +
                Math.random() *
                0.20;

        }

    },
    900
);


/* =========================================================
   ANIMATION LOOP
   ========================================================= */

function animate(
    time
) {

    const delta =
        time -
        lastTime;

    lastTime =
        time;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
    Slight transparent fade
    creates smoky trails.
    */

    ctx.fillStyle =
        "rgba(2,2,4,0.16)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
    Draw particles.
    */

    for (
        let i = 0;

        i < particles.length;

        i++
    ) {

        drawParticle(
            particles[i],
            time
        );

    }


    drawShockwaves();

    drawVoid();


    /*
    Flash the Warp occasionally.
    */

    if (
        flash > 0
    ) {

        ctx.fillStyle =
            "rgba(160,40,255," +
            flash +
            ")";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        flash *=
            0.92;

    }


    requestAnimationFrame(
        animate
    );

}


/* =========================================================
   START
   ========================================================= */

resizeCanvas();

requestAnimationFrame(
    animate
);

</script>


</body>

</html>
