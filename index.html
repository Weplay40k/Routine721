<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routine 721 — War Room</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#08090b;--panel:#111318;--panel2:#17191f;--line:#2b2e36;--text:#f2f1ed;--muted:#8c8f98;--red:#a52b38;--red2:#d14b55;--gold:#c6a85c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0,#321018 0,transparent 35%),radial-gradient(circle at 85% 10%,#151b31 0,transparent 32%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);padding:38px;background:linear-gradient(145deg,#101116,#090a0d);border:1px solid #3b3034;border-radius:12px;box-shadow:0 30px 90px #000b}.sigil{text-align:center;font-size:42px;color:var(--gold)}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--red2);font-weight:800}.login-card .eyebrow{text-align:center;margin-top:8px}.login-card h1{text-align:center;font-size:31px;letter-spacing:5px;margin:10px 0 5px}.login-card h1 span{color:var(--red2)}.muted{color:var(--muted);text-align:center;font-size:11px;letter-spacing:3px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:28px 0 20px}.tabs button,.secondary{border:1px solid var(--line);background:#15171c;color:#bfc1c8;padding:11px;border-radius:6px}.tabs button.active{background:#3a1218;border-color:#82303a;color:#fff}.login-card label,.form-grid label{display:block;color:#a9abb2;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin:14px 0}.login-card input,.form-grid input,.form-grid select,.form-grid textarea{width:100%;margin-top:7px;background:#090a0d;color:#fff;border:1px solid #30333b;border-radius:6px;padding:12px;outline:none}.form-grid textarea{min-height:100px;resize:vertical}.primary{border:1px solid var(--red2);background:linear-gradient(180deg,#a52b38,#7f202c);color:#fff;border-radius:6px;padding:12px 16px;font-weight:800;letter-spacing:1px}.login-card .primary{width:100%;margin-top:14px}.notice{min-height:20px;text-align:center;color:var(--muted);font-size:11px;margin-top:14px}.notice.error{color:#ef7b82}.notice.success{color:#a8d59e}.topbar{height:76px;border-bottom:1px solid var(--line);background:#0b0c0fef;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:900;letter-spacing:4px}.brand-sub{font-size:8px;letter-spacing:2px;color:var(--muted);margin-top:4px}.user-area{display:flex;align-items:center;gap:12px;color:#c5c6ca;font-size:11px}.layout{display:flex;min-height:calc(100vh - 76px)}.sidebar{width:230px;flex:none;padding:22px 14px;background:#0b0c0f;border-right:1px solid var(--line)}.sidebar-label{font-size:9px;color:#686b74;letter-spacing:2px;font-weight:800;padding:0 10px 14px}.nav-button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#92959e;padding:12px 11px;border-radius:6px;margin-bottom:5px;font-size:10px;font-weight:800;letter-spacing:1px}.nav-button:hover,.nav-button.active{background:#261217;border-color:#60252d;color:#fff}.content{flex:1;min-width:0;padding:28px}.content-title{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.content-title h1{margin:6px 0 0;font-size:27px;letter-spacing:3px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px;background:linear-gradient(135deg,#17141a,#0e1014);border:1px solid var(--line);border-radius:9px;margin-bottom:18px}.hero h2{margin:8px 0;font-size:24px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stats article{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}.stats small{display:block;color:#777a83;font-size:9px;letter-spacing:2px}.stats b{display:block;font-size:28px;margin-top:7px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:22px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.panel-head h3{margin:0;font-size:15px;letter-spacing:2px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #333640;border-radius:7px}.game-row,.rank-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 4px;border-bottom:1px solid #262932}.game-row:last-child,.rank-row:last-child{border-bottom:0}.game-row span,.game-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.result{font-size:10px}.result.win{color:#9bd49b}.result.loss{color:#ed747c}.result.draw{color:var(--gold)}.player-grid,.group-grid,.faction-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.player-card,.group-card,.faction-grid article{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:18px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#3a1218;border:1px solid #71303a;color:#fff;font-weight:900}.player-card h3,.group-card h3,.faction-grid h3{margin:12px 0 6px}.player-card p,.group-card span,.faction-grid b{font-size:10px;color:var(--muted)}.player-stats{display:flex;justify-content:space-between;margin-top:18px;font-size:9px;color:#747780}.player-stats strong{color:var(--gold)}.faction-grid article span{font-size:25px;color:var(--gold)}.table{border-top:1px solid var(--line)}.rank-row{grid-template-columns:50px 1fr 120px 70px;display:grid}.rank-row b{color:var(--gold)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.form-grid .wide{grid-column:1/-1}#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}#modal[hidden]{display:none}.modal-card{width:min(700px,100%);max-height:90vh;overflow:auto;background:#101217;border:1px solid #3a3d46;border-radius:10px;padding:22px}@media(max-width:760px){.topbar{padding:12px 15px;height:auto}.user-area span{display:none}.layout{display:block}.sidebar{width:100%;padding:8px;display:flex;overflow-x:auto;gap:5px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:4}.sidebar-label{display:none}.nav-button{white-space:nowrap;width:auto;margin:0;padding:10px 12px;font-size:9px}.content{padding:14px}.content-title h1{font-size:21px}.hero{display:block;padding:18px}.hero .primary{margin-top:15px;width:100%}.stats{grid-template-columns:repeat(2,1fr)}.player-grid,.group-grid,.faction-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-card,.group-card,.faction-grid article{padding:14px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.login-card{padding:26px 20px}.rank-row{grid-template-columns:35px 1fr 80px 55px;font-size:11px}.rank-row span:nth-child(3){font-size:9px}.brand{font-size:16px}}@media(max-width:390px){.player-grid,.group-grid,.faction-grid{grid-template-columns:1fr}.nav-button{font-size:8px;padding:9px 10px}}</style></head><body><div id="boot"><div class="login-shell"><div class="login-card"><div class="sigil">⚔</div><div class="eyebrow">ROUTINE 721</div><h1>WAR ROOM</h1><p class="muted">INITIALISING COMMAND TERMINAL…</p></div></div></div><script src="app.js"></script></body></html>
