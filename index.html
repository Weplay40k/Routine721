                testButton.style.display =
                    "inline-block";

            } catch (error) {

                console.error(
                    "Routine 721 Supabase error:",
                    error
                );

                statusElement.textContent =
                    "Database connection failed.";

                errorElement.style.display =
                    "block";

                errorElement.textContent =
                    error.message ||
                    String(error);
            }
        }

        connectToSupabase();
    </script>
