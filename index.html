<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Routine 721</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 92%;
    max-width: 500px;
    margin: 0 auto;
    padding: 60px 0;
}

.card {
    background: #151515;
    border: 1px solid #4d2924;
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

}

.logo h1 {
    margin: 0;

    margin-top: 0;

label {
    display: block;
    margin-top: 18px;

}

}

input:focus {
    border-color: #c9a84c;
}

button {
    width: 100%;
    padding: 14px;

    font-weight: bold;

}

</style>

<body>

<div class="container">

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="card">

        <div class="logo">
            <h1>ROUTINE 721</h1>
            <p>WAR ROOM</p>
        </div>

        <h2>Sign In</h2>

        <label for="email">Email</label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="your@email.com"
        >

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
        >

        <button id="signInButton" type="button">
            SIGN IN
        </button>

        <button id="createAccountButton"
                class="secondary"
                type="button">
            CREATE ACCOUNT
        </button>

        <div id="authStatus" class="status">
            Ready.
        </div>

    </div>


    <!-- WAR ROOM -->
    <div id="warRoom" class="card hidden">

        <div class="war-room">

            <div class="logo">
                <h1>ROUTINE 721</h1>
                <p>WAR ROOM</p>
            </div>

            <div class="panel">

                <h2>Welcome</h2>

                <p id="userEmail"></p>

                <p class="small">
                    Supabase authentication is working.
                </p>

            </div>

            <button
                id="signOutButton"
                class="secondary"
                type="button">
                SIGN OUT
            </button>

            <div id="warStatus" class="status"></div>

        </div>

    </div>

</div>


<!-- SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>
/*
=====================================================
ROUTINE 721 AUTHENTICATION
=====================================================
*/

/*
IMPORTANT:

We use "routineClient".

We DO NOT create a variable called "supabase".
This avoids the browser error:

Uncaught SyntaxError:
redeclaration of non-configurable global property supabase
*/

const ROUTINE_URL =
    "https://jbgwdxavydhtvoqpbfmj.supabase.co";

const ROUTINE_KEY =
    "sb_publishable_Wt8h6fNelT6zrzf-Dm8FXw_cdSGylaz";


const routineClient =
    window.supabase.createClient(
        ROUTINE_URL,
        ROUTINE_KEY
    );


/*
=====================================================
ELEMENTS
=====================================================
*/

const authScreen =
    document.getElementById("authScreen");

const warRoom =
    document.getElementById("warRoom");

const signInButton =
    document.getElementById("signInButton");

const createAccountButton =
    document.getElementById("createAccountButton");

const signOutButton =
    document.getElementById("signOutButton");

const authStatus =
    document.getElementById("authStatus");

const warStatus =
    document.getElementById("warStatus");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const userEmail =
    document.getElementById("userEmail");


/*
=====================================================
STATUS
=====================================================
*/

function authMessage(message, type) {

    authStatus.textContent = message;

    authStatus.className =
        "status";

    if (type) {
        authStatus.classList.add(type);
    }
}


function warMessage(message, type) {

    warStatus.textContent = message;

    warStatus.className =
        "status";

    if (type) {
        warStatus.classList.add(type);
    }
}


/*
=====================================================
SHOW AUTH
=====================================================
*/

function showAuth() {

    authScreen.classList.remove("hidden");

    warRoom.classList.add("hidden");
}


/*
=====================================================
SHOW WAR ROOM
=====================================================
*/

function showWarRoom(user) {

    authScreen.classList.add("hidden");

    warRoom.classList.remove("hidden");

    if (user && user.email) {

        userEmail.textContent =
            user.email;

    } else {

        userEmail.textContent =
            "";
    }
}


/*
=====================================================
SIGN IN
=====================================================
*/

async function signIn() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email) {

        authMessage(
            "Please enter your email.",
            "error"
        );

        return;
    }


    if (!password) {

        authMessage(
            "Please enter your password.",
            "error"
        );

        return;
    }


    authMessage(
        "Signing in...",
        ""
    );


    signInButton.disabled =
        true;


    try {

        const response =
            await routineClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (response.error) {

            console.error(
                "Supabase sign in error:",
                response.error
            );

            authMessage(
                response.error.message,
                "error"
            );

            signInButton.disabled =
                false;

            return;
        }


        authMessage(
            "Signed in successfully.",
            "success"
        );


        showWarRoom(
            response.data.user
        );


    } catch (error) {

        console.error(error);

        authMessage(
            "Sign in failed: " +
            error.message,
            "error"
        );

    }


    signInButton.disabled =
        false;
}


/*
=====================================================
CREATE ACCOUNT
=====================================================
*/

async function createAccount() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email) {

        authMessage(
            "Please enter your email.",
            "error"
        );

        return;
    }


    if (!password) {

        authMessage(
            "Please enter a password.",
            "error"
        );

        return;
    }


    if (password.length < 6) {

        authMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }


    authMessage(
        "Creating account...",
        ""
    );


    createAccountButton.disabled =
        true;


    try {

        const response =
            await routineClient.auth.signUp({
                email: email,
                password: password
            });


        if (response.error) {

            console.error(
                "Supabase account error:",
                response.error
            );

            authMessage(
                response.error.message,
                "error"
            );

            createAccountButton.disabled =
                false;

            return;
        }


        /*
        If email confirmation is enabled,
        Supabase will not immediately create
        a logged-in session.
        */

        if (!response.data.session) {

            authMessage(
                "Account created! Check your email and confirm your account, then sign in.",
                "success"
            );

        } else {

            authMessage(
                "Account created successfully.",
                "success"
            );

            showWarRoom(
                response.data.user
            );
        }


    } catch (error) {

        console.error(error);

        authMessage(
            "Account creation failed: " +
            error.message,
            "error"
        );

    }


    createAccountButton.disabled =
        false;
}


/*
=====================================================
SIGN OUT
=====================================================
*/

async function signOut() {

    warMessage(
        "Signing out...",
        ""
    );


    const response =
        await routineClient.auth.signOut();


    if (response.error) {

        warMessage(
            response.error.message,
            "error"
        );

        return;
    }


    showAuth();

    authMessage(
        "You have been signed out.",
        "success"
    );
}


/*
=====================================================
BUTTONS
=====================================================
*/

signInButton.addEventListener(
    "click",
    signIn
);


createAccountButton.addEventListener(
    "click",
    createAccount
);


signOutButton.addEventListener(
    "click",
    signOut
);


/*
=====================================================
ENTER KEY
=====================================================
*/

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            signIn();

        }

    }
);


/*
=====================================================
CHECK EXISTING SESSION
=====================================================
*/

async function checkSession() {

    try {

        const response =
            await routineClient.auth.getSession();


        if (
            response.data &&
            response.data.session
        ) {

            showWarRoom(
                response.data.session.user
            );

        } else {

            showAuth();

        }


    } catch (error) {

        console.error(
            "Session error:",
            error
        );

        showAuth();

        authMessage(
            "Unable to check your session.",
            "error"
        );
    }
}


/*
=====================================================
AUTH STATE
=====================================================
*/

routineClient.auth.onAuthStateChange(
    function(event, session) {

        console.log(
            "Auth event:",
            event
        );


        if (session && session.user) {

            showWarRoom(
                session.user
            );

        }

    }
);


/*
=====================================================
START
=====================================================
*/

console.log(
    "ROUTINE 721 authentication loaded."
);


checkSession();

</script>

</body>
</html>
