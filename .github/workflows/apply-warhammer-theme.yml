name: Apply Routine 721 40K theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  theme:
    if: ${{ !contains(github.event.head_commit.message, '[40K-theme]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject visual layer
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- ROUTINE721-40K-THEME -->'
          if marker not in text:
              injection = '''\n    <!-- ROUTINE721-40K-THEME -->\n    <link rel="stylesheet" href="warhammer-theme.css">\n    <script src="warhammer-theme.js" defer></script>\n'''
              text = text.replace('</head>', injection + '</head>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit theme injection
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Theme already injected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply 40K visual layer [40K-theme]'
          git push
